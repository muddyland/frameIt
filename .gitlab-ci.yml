stages:
  - lint
  - test
  - build

variables:
  # Set USE_DHI to "true" to build the image on a Docker Hardened Image (no
  # shell, no package manager) instead of python:3.12-slim. Off by default, so
  # the public mirror builds on slim. DHI_PYTHON_IMAGE is the repository
  # without a tag: the build installs into its "-dev" variant and ships the
  # plain one. The default is Docker's own DHI registry, which needs a login;
  # internally, set DHI_PYTHON_IMAGE as a CI/CD variable to the registry mirror
  # instead (kept out of this file, which is mirrored public). debian13, not
  # alpine: ffmpeg is copied across from Debian's glibc packages, as on slim.
  # 3.12 to stay in step with .python_base below.
  USE_DHI: "false"
  DHI_PYTHON_IMAGE: "dhi.io/python"
  DHI_PYTHON_TAG: "3.12-debian13"

# ── Shared Python setup ────────────────────────────────────────────────────

.python_base:
  # Keep in step with the Dockerfile so the tested combination is the one that
  # ships.
  image: python:3.12-slim
  tags:
    - saas-linux-small-amd64
  before_script:
    - pip install --quiet -r requirements.txt -r tests/requirements.txt psutil

# ── Lint ───────────────────────────────────────────────────────────────────

lint:
  extends: .python_base
  stage: lint
  script:
    - pip install --quiet pylint
    - echo "==> Linting main app..."
    - pylint main.py models.py --rcfile=.pylintrc
    - echo "==> Linting agent..."
    - pylint agent/agent.py --rcfile=.pylintrc
  allow_failure: false

# ── Test ───────────────────────────────────────────────────────────────────

test:
  extends: .python_base
  stage: test
  script:
    - echo "==> Running test suite..."
    - pytest tests/ agent/tests/
        --tb=short
        --cov=main
        --cov=models
        --cov=agent/agent
        --cov-report=term-missing
        --cov-report=xml:coverage.xml
        -q
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 30 days

# ── Dependency freshness ───────────────────────────────────────────────────
# yt-dlp is deliberately unpinned because YouTube changes break older
# releases. Run this on a schedule so a breaking release is caught here rather
# than by a frame that stops caching trailers.
deps:yt-dlp:
  extends: .python_base
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - pip install --quiet --upgrade yt-dlp
    - python -c "import yt_dlp; print('yt-dlp', yt_dlp.version.__version__)"
    - pytest tests/ -q -k trailer
  allow_failure: true

# ── Build ──────────────────────────────────────────────────────────────────

build:
  stage: build
  tags:
    - saas-linux-small-amd64
  image: docker:29.8.2
  services:
    - docker:29.8.2-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - until docker info; do sleep 1; done
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker version
    - echo "Building Docker image..."
    # Push a single image manifest. Docker 29 builds into the containerd image
    # store and attaches a provenance attestation by default, which turns the
    # push into an OCI index; the GitLab registry rejects that with "blob
    # unknown to registry". Without attestations the push is one manifest.
    # USE_DHI swaps the builder and runtime Python images together: ffmpeg and
    # its libraries are copied from one to the other, so the pair must match.
    - |
      BUILD_ARGS=""
      # Pass the job's package index through to the build: pip reads it
      # natively in a job container, but `docker build` does not inherit the
      # job's environment. Unset, the Dockerfile's public default applies,
      # which is the case on the mirror.
      if [ -n "${PIP_INDEX_URL:-}" ]; then
        BUILD_ARGS="$BUILD_ARGS --build-arg PIP_INDEX_URL=$PIP_INDEX_URL"
      fi
      if [ "$USE_DHI" = "true" ]; then
        echo "USE_DHI=true: runtime image on ${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}"
        BUILD_ARGS="$BUILD_ARGS --build-arg PYTHON_BUILDER_IMAGE=${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}-dev"
        BUILD_ARGS="$BUILD_ARGS --build-arg PYTHON_RUNTIME_IMAGE=${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}"
      fi
      docker build --provenance=false --sbom=false $BUILD_ARGS \
        --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME .
    # Smoke test before pushing, with the hardening a deployment should use:
    # the app answers /healthz, and ffmpeg is on PATH and runs as the app user
    # (it is copied across by hand, so a missing library would show here).
    # Through `python`, because the hardened image has no shell.
    - docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL
        --security-opt no-new-privileges $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    - |
      ok=""
      for i in $(seq 30); do
        if docker exec smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=4)"; then
          ok=1; break
        fi
        sleep 2
      done
      if [ -z "$ok" ]; then docker logs smoke; exit 1; fi
    - docker exec smoke python -c "import os, shutil, subprocess; assert os.getuid() == 10001; subprocess.run([shutil.which('ffmpeg'), '-hide_banner', '-version'], check=True)"
    - docker rm -fv smoke
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
